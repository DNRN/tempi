name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The web target's check runs the installed Google Chrome (ADR 0007); its tests must not be skipped.
      - run: google-chrome --version
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
